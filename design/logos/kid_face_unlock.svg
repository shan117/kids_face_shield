<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kid Face Unlock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15A2BA"/>
      <stop offset="1" stop-color="#006072"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- child face -->
  <circle cx="256" cy="262" r="104" fill="#FFF7EC"/>
  <!-- cowlick: reads as 'kid' -->
  <path d="M250 162 C244 120 300 116 290 152 C288 134 266 138 268 168" fill="#FFC24B"/>
  <!-- cheeks -->
  <circle cx="188" cy="290" r="14" fill="#FF9E7A"/>
  <circle cx="324" cy="290" r="14" fill="#FF9E7A"/>
  <!-- eyes -->
  <circle cx="216" cy="252" r="17" fill="#06414E"/>
  <circle cx="296" cy="252" r="17" fill="#06414E"/>
  <circle cx="210" cy="246" r="6" fill="#FFFFFF"/>
  <circle cx="290" cy="246" r="6" fill="#FFFFFF"/>
  <!-- smile -->
  <path d="M214 300 Q256 344 298 300" fill="none" stroke="#06414E" stroke-width="16" stroke-linecap="round"/>
  <!-- face-scan brackets = recognition -->
  <g fill="none" stroke="#FFC24B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 206 L150 168 L188 168"/>
    <path d="M324 168 L362 168 L362 206"/>
    <path d="M150 318 L150 356 L188 356"/>
    <path d="M324 356 L362 356 L362 318"/>
  </g>
</svg>
