<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FaceID Dot Kid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15A2BA"/>
      <stop offset="1" stop-color="#006072"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- projector dot field -->
  <g fill="#FFFFFF" opacity="0.18">
    <circle cx="150" cy="170" r="6"/><circle cx="362" cy="170" r="6"/>
    <circle cx="140" cy="256" r="6"/><circle cx="372" cy="256" r="6"/>
    <circle cx="166" cy="340" r="6"/><circle cx="346" cy="340" r="6"/>
    <circle cx="256" cy="146" r="6"/><circle cx="200" cy="360" r="6"/><circle cx="312" cy="360" r="6"/>
  </g>
  <!-- face built from dots -->
  <g fill="#FFFFFF">
    <circle cx="212" cy="232" r="16"/>
    <circle cx="300" cy="232" r="16"/>
    <circle cx="256" cy="268" r="9"/>
    <!-- smile arc of dots -->
    <circle cx="206" cy="300" r="11"/>
    <circle cx="230" cy="322" r="12"/>
    <circle cx="256" cy="330" r="13"/>
    <circle cx="282" cy="322" r="12"/>
    <circle cx="306" cy="300" r="11"/>
  </g>
  <!-- cowlick dots = kid -->
  <g fill="#FFC24B">
    <circle cx="240" cy="150" r="7"/>
    <circle cx="262" cy="138" r="8"/>
    <circle cx="284" cy="150" r="7"/>
  </g>
</svg>
