      <stop offset="0" stop-color="#15A2BA"/>
      <stop offset="1" stop-color="#006072"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- autofocus reticle = camera locking on the face -->
  <circle cx="256" cy="286" r="150" fill="none" stroke="#FFF7EC" stroke-width="8" opacity="0.9"/>
