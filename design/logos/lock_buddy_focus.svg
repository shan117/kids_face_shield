  <path d="M250 186 C246 162 285 160 279 183" fill="none" stroke="#FFC24B" stroke-width="13" stroke-linecap="round"/>
  <!-- lock body / happy face -->
  <rect x="200" y="252" width="112" height="122" rx="30" fill="#FFF7EC"/>
  <circle cx="234" cy="300" r="13" fill="#06414E"/>
  <circle cx="278" cy="300" r="13" fill="#06414E"/>
  <circle cx="229" cy="295" r="4.5" fill="#FFFFFF"/>
  <circle cx="273" cy="295" r="4.5" fill="#FFFFFF"/>
